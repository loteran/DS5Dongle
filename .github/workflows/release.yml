name: Build release firmware

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach UF2 assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and upload release UF2
    uses: ./.github/workflows/build-firmware.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      version: ${{ github.event.release.tag_name || inputs.tag }}
      asset_suffix: -${{ github.event.release.tag_name || inputs.tag }}
      upload_tag: ${{ github.event.release.tag_name || inputs.tag }}
      # picow (classic RP2040 Pico W) intentionally left at its false default:
      # the RAM-relocation build (cmake/relocate_to_ram.cmake) moves the BT/
      # USB/audio hot path into .time_critical RAM sections, which overflows
      # RP2040's much smaller RAM budget (~264 KB vs RP2350's ~520 KB) by
      # ~200 KB. This fork targets Pico 2 W (RP2350) only.
      waveshare: true
